<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QQ Kashmir · Fleet console</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#10242b;color:#ecf5f0;font:16px system-ui}header{padding:24px}h1{margin:0 0 8px}input,button{padding:12px;border-radius:6px;border:0;margin:8px 4px 0 0}#map{height:70vh}#status{padding:12px}</style><header><h1>QQ Kashmir</h1><p>Live fleet operations · Beta</p><label>API key <input id="key" type="password" autocomplete="off"></label><button id="connect">Connect</button></header><div id="status" role="status">Enter your key to view vehicles.</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([34.0837,74.7973],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const markers={};let active=false;document.getElementById('connect').onclick=()=>{active=true;refresh()};async function refresh(){if(!active)return;try{const r=await fetch('/positions',{headers:{'x-api-key':document.getElementById('key').value}});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();for(const p of rows){if(!markers[p.vehicle])markers[p.vehicle]=L.marker([p.lat,p.lon]).addTo(map).bindTooltip(p.vehicle);else markers[p.vehicle].setLatLng([p.lat,p.lon]);}document.getElementById('status').textContent=rows.length+' vehicles · refreshed '+new Date().toLocaleTimeString()}catch(e){document.getElementById('status').textContent='Connection error: '+e.message}}setInterval(refresh,2000);</script></html>
